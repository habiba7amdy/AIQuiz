    <style>
      :root {
        --bg: #f6f7fb;

        --t: #1f2937;

        --p: #6366f1;
        --ok: #16a34a;
        --okb: #dcfce7;
        --no: #dc2626;

          --bg: #111827;
          --c: #1f2937;
          --t: #f3f4f6;
          --m: #9ca3af;
          --p: #818cf8;
          --okb: #14532d;
          --nob: #7f1d1d;
          --b: #374151;
        }
      }
      * {
        box-sizing: inherit;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--t);
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 720px;
        margin: auto;
        padding: 16px;
      }
      .card {
        background: var(--c);
        border: 1px solid var(--b);
        border-radius: 14px;
        padding: 18px;
        margin-bottom: 14px;
      }
      h1 {
        font-size: 1.3rem;
        margin: 4px 0 12px;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      button,
      select {
        font: inherit;
        border: 1px solid var(--b);
        background: var(--c);
        color: var(--t);
        border-radius: 10px;
        padding: 8px 14px;
        cursor: pointer;
        transition: 0.15s;
      }
      button:hover:not(:disabled) {
        border-color: var(--p);
      }
      button.on,
      button.pri {
        background: var(--p);
        color: #fff;
        border-color: var(--p);
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .opt {
        display: block;
        width: 100%;
        text-align: left;
        margin: 8px 0;
      }
      .opt.ok {
        background: var(--okb);
        border-color: var(--ok);
      }
      .opt.no {
        background: var(--nob);
        border-color: var(--no);
      }
      .opt.sel {
        border-color: var(--p);
        background: var(--p);
        color: #fff;
      }
      .bar {
        height: 8px;
        background: var(--b);
        border-radius: 8px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--p);
        transition: width 0.3s;
      }
      .m {
        color: var(--m);
        font-size: 0.9rem;
      }
      pre {
        background: var(--bg);
        border: 1px solid var(--b);
        padding: 12px;
        border-radius: 10px;
        overflow-x: auto;
        font-size: 0.82rem;
        line-height: 1.45;
        margin: 6px 0;
      }
      table.t {
        border-collapse: collapse;
        font-size: 0.85rem;
        min-width: 100%;
      }
      table.t td,
      table.t th {
        border: 1px solid var(--b);
        padding: 5px 8px;
        text-align: center;
      }
      .fig {
        margin: 10px 0;
        overflow-x: auto;
      }
      math {
        font-size: 1.15em;
      }
      .ex {
        margin-top: 10px;
        padding: 10px;
        border-radius: 10px;
        background: var(--bg);
      }
    </style>
